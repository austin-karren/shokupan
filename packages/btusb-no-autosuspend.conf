# Keep the Framework Desktop's MT7925 Bluetooth adapter (0e8d:0717) out of USB
# autosuspend. Its firmware drops call audio (HFP/SCO) with "ACL packet for
# unknown connection handle"; suspend cycles are a known aggravator. This is a
# mitigation, not a fix — see ADR-0045's 2026-11-02 amendment for how to revert.
options btusb enable_autosuspend=0
