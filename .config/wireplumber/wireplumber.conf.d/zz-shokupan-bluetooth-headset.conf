## Restore headset (HFP) profiles to bluez5.auto-connect.
##
## Omarchy's bluetooth-a2dp-autoconnect.conf sets an A2DP-only auto-connect
## list on every bluez card. auto-connect drives a 2-second reconnect timer
## in spa-bluez5 that re-ConnectProfile()s any listed profile the device has
## dropped — so on a headset with a mic it fights WirePlumber's
## autoswitch-to-headset-profile: a WebRTC page opening the mic switches the
## card to HFP, the timer forces A2DP back, and the card loops between
## profiles until the audio stack fails for the page ("Could not find valid
## non-headset profile, not switching"). See ADR-0045.
##
## This fragment sorts after Omarchy's (conf.d fragments merge in filename
## order, rules arrays append, and the later matching rule's update-props
## win), so every bluez card gets upstream's example list — headset profiles
## included, a2dp_source keeping Omarchy's speaker/receiver intent. Profiles
## a device lacks are ignored, so the broad match is safe.

monitor.bluez.rules = [
  {
    matches = [
      {
        device.name = "~bluez_card.*"
      }
    ]
    actions = {
      update-props = {
        bluez5.auto-connect = [ hfp_hf hsp_hs a2dp_sink a2dp_source ]
      }
    }
  }
]
