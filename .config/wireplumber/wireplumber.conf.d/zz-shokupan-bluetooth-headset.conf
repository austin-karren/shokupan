## Remove A2DP from bluez5.auto-connect on mic-bearing devices.
##
## Omarchy's bluetooth-a2dp-autoconnect.conf sets an A2DP-only auto-connect
## list on every bluez card. auto-connect drives a reconnect timer in
## spa-bluez5 that re-ConnectProfile()s any listed profile the device has
## dropped. On the WF-1000XM6 that is fatal during calls: the buds' firmware
## cannot sustain an active A2DP stream alongside an active SCO/eSCO mic
## link — measured across ~15 cycles, HFP dies 21±1s after every forced A2DP
## transport acquire, then recovers, then A2DP is forced back ~2s later, in a
## self-sustaining ~23-33s transport-kill loop (ADR-0045 + addendum). The
## first revision of this file added headset profiles to the list; that
## changed nothing, because a2dp_sink stayed listed and A2DP was the side
## doing the killing.
##
## So: on any device that carries a mic (headset icon / form-factor), the
## auto-connect list holds ONLY the headset profiles — nothing ever forces
## A2DP back while a call runs. Mic-less speakers and receivers keep
## Omarchy's A2DP nudge untouched. This fragment sorts after Omarchy's
## (conf.d fragments merge in filename order, rules arrays append, and the
## later matching rule's update-props win). Matches are OR'd; the icon match
## is the one verified live on the XM6 card, the form-factor ones cover
## other headsets.
##
## Known residual (ADR-0045 addendum): BlueZ's own policy plugin is a
## second, independent A2DP reconnector (ReconnectUUIDs in
## /etc/bluetooth/main.conf) — if the loop ever survives this fix, that is
## the next suspect, along with the LC3-SWB codec coexistence question.

monitor.bluez.rules = [
  {
    matches = [
      {
        device.name = "~bluez_card.*"
        api.bluez5.icon = "audio-headset"
      }
      {
        device.name = "~bluez_card.*"
        device.form-factor = "headset"
      }
      {
        device.name = "~bluez_card.*"
        device.form-factor = "hands-free"
      }
    ]
    actions = {
      update-props = {
        bluez5.auto-connect = [ hfp_hf hsp_hs ]
      }
    }
  }
]
