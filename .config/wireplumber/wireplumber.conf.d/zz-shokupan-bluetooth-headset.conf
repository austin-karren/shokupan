## Bluetooth calls on this machine: exclude LC3-SWB, keep the full
## auto-connect list. (ADR-0045 + addenda)
##
## Root cause, proven 2026-08-13 by A/B capture tests: the MT7925 BT adapter
## (Framework Desktop, USB 0e8d:0717) cannot run LC3-SWB's transparent eSCO —
## kernel: "HCI Enhanced Setup Synchronous Connection command is advertised,
## but not supported". When the WF-1000XM6 negotiates LC3-SWB for a call, the
## voice link half-establishes (95% digital silence) and dies on a ~21s
## firmware timeout, in a loop: no mic, no audio, connect chime and per-ear
## ANC reset every cycle. PipeWire's quirk table already disables LC3-A127 on
## this adapter family (pipewire#5213) but not standard lc3_swb. Under mSBC
## the same link carried audio for 110s+ and even survived a forced A2DP
## connect. Calls run 16 kHz mSBC instead of 32 kHz SWB — the right trade
## until MT7925 firmware fixes eSCO or LE Audio makes it moot.
##
## ⚠ bluez5.codecs is a WHITELIST (verified against 1.6.8 source,
## bluez5-dbus.c:parse_codec_array): absent = all codecs enabled; present =
## only these. lc3_swb is deliberately omitted; any future codec must be
## added here explicitly. CVSD is mandatory/built-in and unaffected.
monitor.bluez.properties = {
  bluez5.codecs = [ sbc sbc_xq aac ldac aptx aptx_hd faststream msbc ]
}

## Auto-connect: Omarchy's fragment sets an A2DP-only list on every card so
## speakers expose their profiles without hands. Upstream's fuller example
## list adds the headset profiles, which makes the first HFP attach snappy
## too; with LC3-SWB excluded above, A2DP auto-connect is harmless during
## calls (proven by the forced-connect coexistence test). This fragment
## sorts after Omarchy's, so this list wins.
## (An earlier revision dropped a2dp_* here on mic-bearing devices — that
## chased a misdiagnosis and only cost a lazy first A2DP attach. Reverted.)
monitor.bluez.rules = [
  {
    matches = [
      {
        device.name = "~bluez_card.*"
      }
    ]
    actions = {
      update-props = {
        bluez5.auto-connect = [ hfp_hf hsp_hs a2dp_sink a2dp_source ]
      }
    }
  }
]
