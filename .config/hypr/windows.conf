# Personal window rules. Omarchy's own live in
# ~/.local/share/omarchy/default/hypr/windows.conf (read-only) and are sourced
# earlier, so anything here wins.

# GNOME Calendar as a bar popup ------------------------------------------
#
# Driven by ~/.local/bin/calendar-toggle and the bar's calendar module.
#
# `workspace special:calendar` is intentionally WITHOUT the `silent` flag: a
# non-silent rule makes Hyprland reveal the special workspace as the window maps,
# so a cold launch shows the calendar with no polling loop in the toggle script.
# Adding `silent` would open it invisibly and require a second reveal step.
#
# Size is in LOGICAL pixels. The panel is 3840x2560 at scale 1.666667, so the
# logical desktop is 2304x1536 -- see monitors.conf. 1500x1000 is a bit under
# two-thirds of that, which keeps a full month grid readable without becoming a
# de-facto fullscreen window.
windowrule = float on, match:class org.gnome.Calendar
windowrule = center on, match:class org.gnome.Calendar
windowrule = size 1500 1000, match:class org.gnome.Calendar
windowrule = workspace special:calendar, match:class org.gnome.Calendar

# GNOME Settings (gnome-control-center) -------------------------------------
# Floated because it is a dialog-shaped app that tiles badly, but left on the
# normal workspace: Online Accounts hands off to a browser for OAuth, and a
# special workspace would hide the window mid-flow when focus moved to the
# browser (hide_special_on_workspace_change = true).
windowrule = float on, match:class org.gnome.Settings
windowrule = center on, match:class org.gnome.Settings
windowrule = size 1500 1000, match:class org.gnome.Settings

# The About TUI ---------------------------------------------------------------
#
# Omarchy's Menu > About runs `omarchy-launch-about`, which is fastfetch wrapped
# in `bash -c 'fastfetch; read -n 1 -s'`. That inherits Omarchy's generic
# floating-window size of 875x600, which is too narrow for fastfetch: every value
# wrapped mid-word ("Linux 7.1.6-1-cachyo / s").
#
# Measured rather than guessed. At 875x600 the terminal reports 88 columns and 26
# rows; fastfetch needs 116 columns (a 54-wide logo plus the info column) and
# emits 29 lines, 30 with the "press any key" prompt. That puts a cell at ~9.94 x
# ~23.08 logical px, so 1200x740 gives ~120 columns and ~31 rows -- enough for
# both with a little slack, and still about half the 2304x1536 logical desktop.
#
# The class is org.omarchy.bash, not something About-specific:
# omarchy-launch-or-focus-tui derives the app-id from the first word of the
# command it is given, and About's command starts with `bash`. Any other TUI
# launched as `bash -c ...` would take this size too. About is the only one today.
#
# `match:tag floating-window` is load-bearing and NOT decoration. Omarchy sizes
# this window with `size 875 600, match:tag floating-window`, and a tag-matched
# rule beats a class-matched one no matter which file is sourced later -- tags
# resolve in their own pass. Measured: with `match:class` alone, neither a size
# nor a move rule had any effect, while the identical rule against an unused
# class applied immediately. Matching the tag as well puts this rule in the same
# pass, where being sourced later is what makes it win.
windowrule = size 1200 740, match:tag floating-window, match:class org.omarchy.bash
