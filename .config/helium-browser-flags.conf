# Read by /usr/bin/helium-browser (the helium-wrapper script) before it execs the
# browser, so these flags reach *every* launch path: the Hyprland browser binds,
# omarchy-launch-webapp's --app windows, .desktop entries and the command line
# alike. A flag added to a .desktop Exec line would not — both omarchy-launch-browser
# and omarchy-launch-webapp keep only the first token of that line. See ADR-0036.

# Windows-style middle-click autoscroll: press the middle button for the round
# anchor, move the pointer to scroll continuously, click to stop. Helium's own
# flag (chrome://flags#middle-click-autoscroll); stock Chromium has no such entry
# and needs --enable-blink-features instead.
--enable-features=HeliumMiddleClickAutoscroll
