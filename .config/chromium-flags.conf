# Read by /usr/bin/chromium's launcher before it execs the browser, so these flags
# reach every launch path rather than only the .desktop entry. Comments and blank
# lines are skipped by the launcher. See ADR-0036.
#
# The first four lines are Omarchy's, adopted verbatim when this file was brought
# into the repo — nothing in /usr/share/omarchy writes or rewrites it, so tracking
# it costs nothing and buys `loaf heal`'s displacement check.

--ozone-platform=wayland
--ozone-platform-hint=wayland
--enable-features=TouchpadOverscrollHistoryNavigation
--load-extension=/usr/share/omarchy/default/chromium/extensions/copy-url,/usr/share/omarchy/default/chromium/extensions/yt-dlp

# Windows-style middle-click autoscroll. Stock Chromium ships no chrome://flags
# entry for this; the only lever is the Blink runtime feature. Deliberately a
# *different* switch from --enable-features above — Chromium takes the last
# occurrence of a given switch, so folding this into that line would be required
# if it were the same one.
--enable-blink-features=MiddleClickAutoscroll
